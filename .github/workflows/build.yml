name: Build Streammania

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E "^e: |error:|What went wrong|Could not (find|resolve)" -A2 build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Build failed::${msg:-See the build log}"

      # Streammania.apk is the new name; EmberTV.apk keeps old Downloader links working.
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Streammania.apk
          cp app/build/outputs/apk/release/app-release.apk EmberTV.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Streammania build ${{ github.run_number }}
          body: |
            Install on your TV with the Downloader app using:
            https://github.com/${{ github.repository }}/releases/latest/download/Streammania.apk
          files: |
            Streammania.apk
            EmberTV.apk
          make_latest: true
